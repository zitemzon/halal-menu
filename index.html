<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f4a">
<title>สุ่มเมนูฮาลาลปักษ์ใต้</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-title" content="สุ่มเมนู">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#1d2a24;--muted:#4f5a54;--line:#e4dccb;--accent:#1f5f4a;--gold:#7a5200;--goldbg:#f7ead0;--greenbg:#e7efe9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;margin:0 auto;padding:28px 16px 48px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--gold)}
h1{margin:4px 0;font-family:'Mitr',sans-serif;font-weight:600;font-size:34px;line-height:1.2}
h2{margin:0;font-family:'Mitr',sans-serif;font-weight:500;font-size:19px}
.lead{margin:0;font-size:16px;line-height:1.5;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
button{font-family:inherit;cursor:pointer;color:var(--ink)}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid #d9cfbb;background:var(--card);font-size:15px;font-weight:500}
.chip span{color:#5b6660;font-weight:400}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip.on span{color:#fff;opacity:.8}
.result{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 20px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.dish{font-family:'Mitr',sans-serif;font-weight:500;font-size:32px;line-height:1.25}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.9);opacity:.2}100%{transform:scale(1);opacity:1}}
.tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tag{padding:4px 12px;border-radius:999px;font-size:14px;font-weight:600}
.tag.g{background:var(--greenbg);color:var(--accent)}.tag.y{background:var(--goldbg);color:var(--gold)}
.small{font-size:14px;color:#5b6660}
.notice{padding:12px 14px;border-radius:14px;background:var(--goldbg);color:#5c3d00;font-size:15px}
.spin{min-height:60px;border:none;border-radius:18px;background:var(--accent);color:#fff;font-family:'Mitr',sans-serif;font-size:22px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:10px}
.spin:active{transform:scale(.98)}
.prog{display:flex;justify-content:space-between;font-size:15px;color:var(--muted)}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:8px}
.bar div{height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sec{min-height:48px;border-radius:14px;border:1px solid #d9cfbb;background:var(--card);font-size:16px;font-weight:500}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid #efe8da}
.row:first-child{border-top:none}
.row .n{width:26px;font-size:14px;color:#5b6660}
.row .nm{flex:1;font-size:16px}
.row .c{font-size:13px;color:var(--accent)}
.row .m{font-size:13px;color:var(--gold)}
.row.used .nm{color:#8a918d;text-decoration:line-through}
.done{padding:2px 10px;border-radius:999px;background:var(--greenbg);color:var(--accent);font-size:13px;font-weight:600}
.foot{margin:8px 0 0;font-size:14px;line-height:1.55;color:#5b6660}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="eyebrow">HALAL · อาหารปักษ์ใต้ · ไม่มีหมู</div>
    <h1>วันนี้กินอะไรดี</h1>
    <p class="lead" id="lead"></p>
  </header>

  <div class="chips" id="chips" role="group" aria-label="เลือกหมวดอาหาร"></div>

  <section class="result" id="result" aria-live="polite"></section>
  <div class="notice" id="notice" hidden></div>

  <button type="button" class="spin" id="spinBtn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
    สุ่มเมนู
  </button>

  <div>
    <div class="prog"><span id="progL"></span><span id="progR"></span></div>
    <div class="bar"><div id="barFill" style="width:0%"></div></div>
  </div>

  <div class="two">
    <button type="button" class="sec" id="resetBtn">เริ่มรอบใหม่</button>
    <button type="button" class="sec" id="listBtn">ดูเมนูทั้งหมด</button>
  </div>

  <section id="histSec" hidden>
    <h2>ประวัติการสุ่ม (ล่าสุด 10 รายการ)</h2>
    <div class="list" id="hist" style="margin-top:8px"></div>
  </section>

  <section id="listSec" hidden>
    <h2 id="listTitle"></h2>
    <div class="list" id="allList" style="margin-top:8px"></div>
  </section>

  <p class="foot">หมายเหตุ: ควรเลือกวัตถุดิบ เนื้อสัตว์ และเครื่องปรุง (ซอส น้ำมัน กะปิ) ที่มีเครื่องหมายรับรองฮาลาล</p>
</main>

<script>
(function () {
  // ===== 1) DATA : "ชื่อเมนู|วัตถุดิบหลัก" แยกตามหมวด =====
  var RAW = {
    curry: ['แกงไตปลา|ปลา','แกงส้มปลากะพงหน่อไม้ดอง|ปลา','แกงเหลืองกุ้งมะละกอ|กุ้ง','แกงส้มปลาทูมะละกอ|ปลา','แกงเหลืองไก่หน่อไม้ดอง|ไก่','แกงคั่วหอยขมใบชะพลู|ทะเล','แกงคั่วยอดมะพร้าวกุ้ง|กุ้ง','แกงกะทิผักบุ้งปลาย่าง|ปลา','แกงพริกเนื้อ|เนื้อ','แกงพริกไก่|ไก่','แกงมัสมั่นไก่|ไก่','แกงมัสมั่นเนื้อ|เนื้อ','กุรุหม่าไก่|ไก่','กุรุหม่าเนื้อ|เนื้อ','แกงเขียวหวานไก่|ไก่','แกงเผ็ดไก่หน่อไม้|ไก่','ซุปหางวัว|เนื้อ','ซุปเนื้อ|เนื้อ','ซุปไก่|ไก่','ต้มส้มปลากระบอก|ปลา','ต้มยำปลากะพง|ปลา','ต้มยำกุ้งน้ำใส|กุ้ง','ต้มเค็มปลาทู|ปลา','ไก่ต้มขมิ้น|ไก่','แกงจืดวุ้นเส้นไก่สับ|ไก่','แกงจืดสาหร่ายเต้าหู้ไข่|ผัก/ไข่'],
    rice: ['ข้าวหมกไก่|ไก่','ข้าวหมกเนื้อ|เนื้อ','ข้าวหมกแพะ|แพะ','ข้าวยำปักษ์ใต้|ผัก/ไข่','นาซิดาแก|ปลา','นาซิเลอมัก|ผัก/ไข่','ข้าวมันไก่ฮาลาล|ไก่','ข้าวต้มปลา|ปลา','ข้าวต้มกุ้ง|กุ้ง','ข้าวผัดกุ้ง|กุ้ง','ข้าวผัดปู|ทะเล','ข้าวผัดไก่|ไก่','ข้าวกะเพราไก่ไข่ดาว|ไก่','ข้าวเหนียวไก่ทอด|ไก่','ขนมจีนน้ำยาปักษ์ใต้|ปลา','ขนมจีนแกงไตปลา|ปลา','ละแซ|ปลา','หมี่ฮกเกี้ยนผัดทะเล|ทะเล','ผัดไทยกุ้งสด|กุ้ง','ก๋วยเตี๋ยวเนื้อตุ๋น|เนื้อ','ก๋วยเตี๋ยวไก่ตุ๋น|ไก่','โรตีแกงไก่|ไก่','โรตีแกงเนื้อ|เนื้อ','มะตะบะไก่|ไก่','มะตะบะเนื้อ|เนื้อ'],
    fry: ['คั่วกลิ้งไก่|ไก่','คั่วกลิ้งเนื้อ|เนื้อ','ผัดสะตอกุ้ง|กุ้ง','ผัดสะตอไก่|ไก่','ผัดใบเหลียงใส่ไข่|ผัก/ไข่','ไข่เจียวผักเหลียง|ผัก/ไข่','หมึกผัดน้ำดำ|ทะเล','ปูผัดผงกะหรี่|ทะเล','กุ้งทอดกระเทียม|กุ้ง','หมึกทอดกระเทียม|ทะเล','ปลาทอดขมิ้น|ปลา','ปลากะพงทอดน้ำปลา|ปลา','ปลาอินทรีเค็มทอด|ปลา','ไก่ทอดขมิ้น|ไก่','ไก่ทอดหาดใหญ่|ไก่','ไก่กอและ|ไก่','สะเต๊ะไก่|ไก่','สะเต๊ะเนื้อ|เนื้อ','เนื้อทอดกระเทียม|เนื้อ','เนื้อแดดเดียวทอด|เนื้อ','ผัดเผ็ดปลาดุก|ปลา','ผัดพริกแกงไก่ถั่วฝักยาว|ไก่','ไก่ผัดขิง|ไก่','หอยแมลงภู่อบสมุนไพร|ทะเล','ผัดผักบุ้งไฟแดง|ผัก/ไข่'],
    yum: ['น้ำพริกกะปิ ผักเหนาะ ปลาทูทอด|ปลา','น้ำพริกกุ้งเสียบ|กุ้ง','น้ำชุบหยำ|ผัก/ไข่','น้ำบูดูผักสด|ผัก/ไข่','ยำสาหร่ายผมนาง|ทะเล','ยำผักกูด|ผัก/ไข่','ยำปลาดุกฟู|ปลา','ยำทะเล|ทะเล','ยำวุ้นเส้นกุ้งสด|กุ้ง','ส้มตำไทยไก่ทอด|ไก่'],
    sweet: ['อาเกาะ|ของหวาน','ขนมโค|ของหวาน','ขนมจาก|ของหวาน','โรตีกล้วยไข่|ของหวาน','บัวลอยมะพร้าวอ่อน|ของหวาน','ข้าวเหนียวมะม่วง|ของหวาน','ลอดช่องน้ำกะทิ|ของหวาน','ข้าวเหนียวสังขยา|ของหวาน']
  };
  var CATS = [
    { key: 'all', label: 'ทั้งหมด' }, { key: 'curry', label: 'แกง/ต้ม' },
    { key: 'rice', label: 'ข้าว/เส้น/โรตี' }, { key: 'fry', label: 'ผัด/ทอด/ย่าง' },
    { key: 'yum', label: 'ยำ/น้ำพริก' }, { key: 'sweet', label: 'ของหวาน' }
  ];
  var LABEL = {}; CATS.forEach(function (c) { LABEL[c.key] = c.label; });
  var MENU = [];
  Object.keys(RAW).forEach(function (cat) {
    RAW[cat].forEach(function (r) { var p = r.split('|'); MENU.push({ id: MENU.length, name: p[0], main: p[1], cat: cat }); });
  });

  // ===== 2) STATE (เก็บในหน่วยความจำ) =====
  var S = { cat: 'all', used: new Set(), current: null, history: [], draws: 0, notice: '', showList: false };
  function pool(cat) { return MENU.filter(function (m) { return cat === 'all' ? m.cat !== 'sweet' : m.cat === cat; }); }
  function $(id) { return document.getElementById(id); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // ===== 3) LOGIC : สุ่มแบบไม่ซ้ำจนกว่าจะครบหมวด =====
  function spin() {
    var p = pool(S.cat), left = p.filter(function (m) { return !S.used.has(m.id); });
    S.notice = '';
    if (!left.length) { p.forEach(function (m) { S.used.delete(m.id); }); left = p.slice(); S.notice = 'สุ่มครบทุกเมนูในหมวดนี้แล้ว — เริ่มรอบใหม่อัตโนมัติ'; }
    var cand = left.filter(function (m) { return !S.current || m.id !== S.current.id; });
    if (!cand.length) cand = left;
    var pick = cand[Math.floor(Math.random() * cand.length)];
    S.used.add(pick.id); S.current = pick; S.draws++;
    S.history.unshift(pick); S.history = S.history.slice(0, 10);
    render(true);
  }
  function reset() {
    pool(S.cat).forEach(function (m) { S.used.delete(m.id); });
    S.current = null; S.notice = 'ล้างรอบของหมวดนี้แล้ว เริ่มสุ่มใหม่ได้เลย'; render();
  }

  // ===== 4) RENDER =====
  function render(anim) {
    var p = pool(S.cat), usedIn = p.filter(function (m) { return S.used.has(m.id); }).length;
    $('lead').textContent = 'สุ่มเมนูบ้านๆ หาทานง่าย ไม่ซ้ำจนกว่าจะครบรอบ — อาหารคาว ' + pool('all').length + ' เมนู, ของหวาน ' + pool('sweet').length + ' เมนู';
    $('chips').innerHTML = CATS.map(function (c) {
      return '<button type="button" class="chip' + (c.key === S.cat ? ' on' : '') + '" data-cat="' + c.key + '" aria-pressed="' + (c.key === S.cat) + '">' + c.label + ' <span>' + pool(c.key).length + '</span></button>';
    }).join('');
    var r = $('result');
    if (S.current) {
      r.innerHTML = '<div class="small">เมนูที่สุ่มได้ ครั้งที่ ' + S.draws + '</div><div class="dish' + (anim ? ' pop' : '') + '">' + esc(S.current.name) + '</div><div class="tags"><span class="tag g">' + LABEL[S.current.cat] + '</span><span class="tag y">' + esc(S.current.main) + '</span></div>';
    } else {
      r.innerHTML = '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#b3a88f" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2"/><circle cx="15.5" cy="15.5" r="1.2"/><circle cx="12" cy="12" r="1.2"/></svg><div style="font-size:17px;color:#4f5a54">กดปุ่ม “สุ่มเมนู” ด้านล่างได้เลย</div>';
    }
    $('notice').hidden = !S.notice; $('notice').textContent = S.notice;
    $('progL').textContent = 'สุ่มแล้ว ' + usedIn + ' / ' + p.length + ' ในหมวดนี้';
    $('progR').textContent = 'เหลือ ' + (p.length - usedIn) + ' เมนู';
    $('barFill').style.width = (p.length ? Math.round(usedIn / p.length * 100) : 0) + '%';
    $('histSec').hidden = !S.history.length;
    $('hist').innerHTML = S.history.map(function (m, i) {
      return '<div class="row"><span class="n">' + (i + 1) + '</span><span class="nm">' + esc(m.name) + '</span><span class="c">' + LABEL[m.cat] + '</span></div>';
    }).join('');
    $('listBtn').textContent = S.showList ? 'ซ่อนรายการ' : 'ดูเมนูทั้งหมด';
    $('listSec').hidden = !S.showList;
    $('listTitle').textContent = 'เมนูในหมวด “' + LABEL[S.cat] + '” (' + p.length + ')';
    $('allList').innerHTML = p.map(function (m, i) {
      var u = S.used.has(m.id);
      return '<div class="row' + (u ? ' used' : '') + '"><span class="n">' + (i + 1) + '</span><span class="nm">' + esc(m.name) + '</span>' + (u ? '<span class="done">สุ่มแล้ว</span>' : '') + '<span class="m">' + esc(m.main) + '</span></div>';
    }).join('');
  }

  // ===== 5) EVENTS =====
  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('[data-cat]'); if (!b) return;
    S.cat = b.getAttribute('data-cat'); S.notice = ''; render();
  });
  $('spinBtn').addEventListener('click', spin);
  $('resetBtn').addEventListener('click', reset);
  $('listBtn').addEventListener('click', function () { S.showList = !S.showList; render(); });
  render();
})();
</script>
</body>
</html>
